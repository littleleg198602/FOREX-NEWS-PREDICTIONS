name: Evaluate Predictions

on:
  workflow_dispatch:
  push:
    paths:
      - "data/predictions/**"
      - "src/evaluation/**"
      - "src/statistics/**"
      - "src/learning/**"
      - "src/market_data/**"
      - "src/prediction/**"
      - "schemas/**"
      - "tests/**"
      - "config/instruments.yaml"
      - "config/market_context.yaml"
      - "config/evaluation.yaml"
      - "config/model.yaml"
      - ".gitignore"
      - "requirements.txt"
      - ".github/workflows/evaluate-predictions.yml"
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: evaluate-predictions-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run unit and audit regression tests
        run: python -m pytest tests -v

      - name: Validate and normalize prediction intake
        run: python -m src.prediction.validate_all

      - name: Smoke test Yahoo tracked and context data
        run: python -m src.market_data.smoke_test

      - name: Evaluate all predictions with leakage-safe v2
        run: python -m src.evaluation.evaluate_all

      - name: Build v2 performance statistics
        run: python -m src.statistics.build_stats

      - name: Build v2 context-aware learning profile
        run: python -m src.learning.build_learning_profile

      - name: Build prediction quality audit
        run: python tools/prediction_quality_audit.py

      - name: Commit v2 evaluation results and statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git add data/evaluations_v2 data/statistics_v2
            if git diff --cached --quiet; then
              echo "No v2 evaluation/statistics changes to commit."
              exit 0
            fi

            git commit -m "Update leakage-safe v2 evaluations and learning profile"

            if git push origin HEAD:main; then
              echo "V2 evaluation results published successfully."
              exit 0
            fi

            echo "Push raced with a newer commit on main (attempt ${attempt}/3)."
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to publish after 3 attempts."
              exit 1
            fi

            git fetch origin main
            git reset --hard origin/main
            python -m pytest tests -q
            python -m src.prediction.validate_all
            python -m src.evaluation.evaluate_all
            python -m src.statistics.build_stats
            python -m src.learning.build_learning_profile
            python tools/prediction_quality_audit.py
          done
