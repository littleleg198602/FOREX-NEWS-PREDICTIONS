name: Evaluate Predictions

on:
  workflow_dispatch:
  push:
    paths:
      - "data/predictions/**"
      - "src/evaluation/**"
      - "src/statistics/**"
      - "src/learning/**"
      - "src/market_data/**"
      - "tests/**"
      - "config/instruments.yaml"
      - "config/market_context.yaml"
      - ".gitignore"
      - "requirements.txt"
      - ".github/workflows/evaluate-predictions.yml"
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: evaluate-predictions-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests -v

      - name: Evaluate all predictions against Yahoo
        run: python -m src.evaluation.evaluate_all

      - name: Build performance statistics
        run: python -m src.statistics.build_stats

      - name: Build context-aware learning profile
        run: python -m src.learning.build_learning_profile

      - name: Commit evaluation results and statistics
        run: |
          git add data/evaluations data/statistics
          if git diff --cached --quiet; then
            echo "No evaluation/statistics changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Yahoo evaluations, statistics and context learning profile"
          git pull --rebase origin main
          git push
