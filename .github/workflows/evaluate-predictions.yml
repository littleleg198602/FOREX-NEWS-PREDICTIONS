name: Evaluate Predictions

on:
  workflow_dispatch:
  push:
    paths:
      - "data/predictions/**"
      - "src/evaluation/**"
      - "src/statistics/**"
      - "src/learning/**"
      - "src/market_data/**"
      - "tests/**"
      - "config/instruments.yaml"
      - "config/market_context.yaml"
      - ".gitignore"
      - "requirements.txt"
      - ".github/workflows/evaluate-predictions.yml"
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: evaluate-predictions-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests -v

      - name: Evaluate all predictions against Yahoo
        run: python -m src.evaluation.evaluate_all

      - name: Build performance statistics
        run: python -m src.statistics.build_stats

      - name: Build context-aware learning profile
        run: python -m src.learning.build_learning_profile

      - name: Commit evaluation results and statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git add data/evaluations data/statistics
            if git diff --cached --quiet; then
              echo "No evaluation/statistics changes to commit."
              exit 0
            fi

            git commit -m "Update Yahoo evaluations, statistics and context learning profile"

            if git push origin HEAD:main; then
              echo "Evaluation results published successfully."
              exit 0
            fi

            echo "Push raced with a newer commit on main (attempt ${attempt}/3)."
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to publish after 3 attempts."
              exit 1
            fi

            # Evaluation/statistics files are generated artifacts. Instead of
            # rebasing them and creating content conflicts, sync to the newest
            # main and regenerate from the latest prediction set.
            git fetch origin main
            git reset --hard origin/main
            python -m pytest tests -q
            python -m src.evaluation.evaluate_all
            python -m src.statistics.build_stats
            python -m src.learning.build_learning_profile
          done
