name: Market Data Test

on:
  workflow_dispatch:
  push:
    paths:
      - "config/instruments.yaml"
      - "config/market_context.yaml"
      - "src/market_data/**"
      - "src/evaluation/**"
      - "src/learning/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/market-data-test.yml"

jobs:
  market-data-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests -v

      - name: Test tracked and context Yahoo market data
        run: python -m src.market_data.smoke_test
