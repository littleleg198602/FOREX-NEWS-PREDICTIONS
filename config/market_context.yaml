version: 2

# Context must only use information available strictly before the prediction
# decision time. Candidate symbols are tried in order; a fresh fallback may be
# preferred when the primary cash-market series is stale or unavailable.
context_series:
  DXY:
    kind: "index"
    role: "usd_strength"
    candidates:
      - symbol: "DX-Y.NYB"
      - symbol: "DX=F"
        proxy_for: "US Dollar Index"

  US2Y:
    kind: "yield"
    role: "front_end_rates"
    candidates:
      - symbol: "ZT=F"
        proxy_for: "US 2Y Treasury yield"
        inverse_to_role: true
        trend_metric: "pct"

  US10Y:
    kind: "yield"
    role: "long_rates"
    candidates:
      - symbol: "^TNX"
        trend_metric: "abs"
      - symbol: "ZN=F"
        proxy_for: "US 10Y Treasury yield"
        inverse_to_role: true
        trend_metric: "pct"

  VIX:
    kind: "index"
    role: "risk_aversion"
    max_staleness_minutes: 1440
    candidates:
      - symbol: "^VIX"

  WTI:
    kind: "commodity"
    role: "oil"
    candidates:
      - symbol: "CL=F"

  BRENT:
    kind: "commodity"
    role: "oil"
    candidates:
      - symbol: "BZ=F"

lookbacks_minutes:
  short: 60
  long: 240
  history: 5760

freshness:
  default_max_staleness_minutes: 180

regimes:
  VIX:
    low_below: 18.0
    high_at_or_above: 25.0
  DXY:
    trend_threshold_pct_60m: 0.15
  US2Y:
    trend_threshold_abs_60m: 0.03
    trend_threshold_pct_60m: 0.02
  US10Y:
    trend_threshold_abs_60m: 0.03
    trend_threshold_pct_60m: 0.02
  WTI:
    trend_threshold_pct_60m: 0.75
  BRENT:
    trend_threshold_pct_60m: 0.75

learning:
  minimum_sample_early_signal: 10
  minimum_sample_actionable: 30
  strong_sample: 75
  minimum_unique_events_early_signal: 5
  minimum_unique_events_actionable: 15
  strong_unique_events: 30
  actionable_min_hit_rate_pct: 58.0
  actionable_max_hit_rate_pct: 42.0
